name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC -> GCP

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/rag-assistant/api:${GITHUB_SHA::7} .
          docker push asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/rag-assistant/api:${GITHUB_SHA::7}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rag-assistant \
            --image=asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/rag-assistant/api:${GITHUB_SHA::7} \
            --region=asia-south1 \
            --min-instances=0 --max-instances=5 \
            --set-env-vars=LLM_PROVIDER=auto,GEMINI_MODEL=gemini-2.5-flash,NVIDIA_MODEL=deepseek-ai/deepseek-v4.1-flash,TOP_K=3,TEMPERATURE=0.2,RELEVANCE_THRESHOLD=0.35,MAX_TOKENS=512 \
            --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest \
            --allow-unauthenticated

      - name: Smoke test Cloud Run /health
        run: |
          URL=$(gcloud run services describe rag-assistant --region=asia-south1 --format='value(status.url)')
          echo "Deployed URL: $URL"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL/health"; then
              echo "deploy healthy"
              exit 0
            fi
            sleep 10
          done
          echo "deploy unhealthy after 5 retries"
          exit 1